<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHL MegaMinds — Coming Soon</title>
  <meta name="description" content="GHL MegaMinds is launching soon. GoHighLevel automation, funnels and CRM systems for growth-minded businesses." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lily+Script+One&family=Inter:wght@400;500&family=Archivo:wdth,wght@100,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f2f2;
      --ink: #000;
      --muted: #999;
      --colon: #333;
      --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-logo: "Lily Script One", cursive;
      --font-display: "Archivo", "Inter", system-ui, sans-serif;
      --speed: 60; /* marquee px per second */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .site {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ---------- Header ---------- */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 0;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-logo);
      font-size: 20px;
      line-height: 1.2;
      padding-left: 20px;
    }

    .logo svg { width: 14px; height: 14px; }

    nav { display: flex; gap: 20px; padding-right: 20px; }

    /* Slide-up hover link (two stacked copies) */
    .hl {
      position: relative;
      display: inline-block;
      overflow: hidden;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.2;
      text-transform: uppercase;
      height: 17px;
    }
    .hl span {
      display: block;
      transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .hl:hover span { transform: translateY(-100%); }

    nav .icon { display: none; }
    nav .icon svg { width: 22px; height: 22px; }

    /* ---------- Center content ---------- */
    .center {
      position: absolute;
      inset: 0;
      /* no z-index / transform here: a stacking context would isolate the
         difference blend from the marquee behind it */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding-bottom: 40px;
    }

    .countdown {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 4px;
      animation: fadeIn 1s 0.2s ease both;
    }

    .unit { display: flex; flex-direction: column; align-items: center; }
    .unit .n {
      font-size: 40px;
      font-weight: 400;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: center;
    }
    .unit .l {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.2;
      margin-top: 4px;
    }
    .colon {
      font-size: 40px;
      line-height: 1.2;
      color: var(--colon);
      padding-top: 10px;
    }

    /* Headline: white + difference blend = black on light bg, inverts over images */
    .headline-wrap {
      position: relative;
      z-index: 2;
      mix-blend-mode: difference;
      color: #fff;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-family: var(--font-display);
      font-variation-settings: "wdth" 100;
      font-weight: 700;
      font-size: clamp(50px, 8.7vw, 125px);
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 .w {
      display: inline-block;
      animation: reveal 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    h1 .w + .w { animation-delay: 0.15s; }

    h1 .sm {
      display: inline-block;
      font-size: 0.48em;
      vertical-align: top;
      line-height: 1.55;
      letter-spacing: 0;
    }

    /* ---------- Marquee ---------- */
    .marquee {
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }

    .track {
      position: absolute;
      top: 50%;
      left: 0;
      height: 210px;
      margin-top: -105px;
      display: flex;
      will-change: transform;
      transform-style: preserve-3d;
    }

    .card {
      position: relative;
      flex: 0 0 170px;
      width: 170px;
      height: 210px;
      margin-right: 130px;
      border-radius: 8px;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      background: #ddd;
    }

    .card svg, .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* per-card scale & vertical offset (echoes the original's varied layout) */
    .card[data-s="1"]  { --s: 1.40; --y: -150px; }
    .card[data-s="2"]  { --s: 0.90; --y:   40px; }
    .card[data-s="3"]  { --s: 1.33; --y:  -30px; }
    .card[data-s="4"]  { --s: 1.16; --y:  -90px; }
    .card[data-s="5"]  { --s: 0.83; --y:  135px; }
    .card[data-s="6"]  { --s: 1.27; --y:  195px; }
    .card[data-s="7"]  { --s: 0.90; --y:   60px; }

    /* ---------- Footer ---------- */
    footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 20px;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .contact { display: flex; align-items: center; gap: 8px; }

    /* ---------- Animations ---------- */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 809px) {
      header { padding: 20px 20px 0; }
      .logo { padding-left: 0; }
      nav { padding-right: 0; gap: 28px; }
      nav .hl { display: none; }
      nav .icon { display: inline-block; }

      .center {
        inset: 0 0 56vh 0;
        justify-content: flex-end;
        padding-bottom: 0;
      }
      .countdown { gap: 14px; }
      .unit .n { font-size: 40px; }
      h1 { font-size: clamp(40px, 13.5vw, 64px); }

      .marquee { top: 46vh; bottom: 70px; }
      .track { top: 50%; }
      .card { margin-right: 60px; }

      footer {
        flex-direction: column-reverse;
        gap: 10px;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 .w, .countdown { animation: none; }
    }
  </style>
</head>
<body>

    <!-- Countdown + headline -->

  <script>
    // ---- Launch date: change this ----
    const LAUNCH_DATE = new Date("2026-11-01T00:00:00");

    const pad = (n, w = 2) => String(Math.max(0, n)).padStart(w, "0");
    const $ = id => document.getElementById(id);
    function tick() {
      const diff = Math.max(0, LAUNCH_DATE - Date.now());
      $("days").textContent    = pad(Math.floor(diff / 864e5), 3);
      $("hours").textContent   = pad(Math.floor(diff / 36e5) % 24);
      $("minutes").textContent = pad(Math.floor(diff / 6e4) % 60);
      $("seconds").textContent = pad(Math.floor(diff / 1e3) % 60);
    }
    tick(); setInterval(tick, 1000);
    $("year").textContent = new Date().getFullYear();

    // ---- Infinite 3D marquee ----
    const track = $("track");
    const originals = Array.from(track.children);
    // clone until we have enough to cover any viewport twice
    const needed = Math.ceil((window.innerWidth * 2) / (originals.length * 300)) + 1;
    for (let i = 0; i < needed; i++) originals.forEach(c => track.appendChild(c.cloneNode(true)));
    const cards = Array.from(track.children);

    const speed = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--speed")) || 60;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let setWidth = 0, offset = 0, last = performance.now();

    function measure() {
      const first = originals[0], lastOrig = originals[originals.length - 1];
      setWidth = (lastOrig.offsetLeft + lastOrig.offsetWidth + parseFloat(getComputedStyle(lastOrig).marginRight)) - first.offsetLeft;
    }
    measure();
    addEventListener("resize", measure);

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!reduce) offset = (offset + speed * dt) % setWidth;
      track.style.transform = `translate3d(${-offset}px,0,0)`;

      const vw = innerWidth, center = vw / 2;
      for (const c of cards) {
        const s = parseFloat(getComputedStyle(c).getPropertyValue("--s")) || 1;
        const y = getComputedStyle(c).getPropertyValue("--y") || "0px";
        const cx = c.offsetLeft - offset + c.offsetWidth / 2;
        if (cx < -400 || cx > vw + 400) { c.style.visibility = "hidden"; continue; }
        c.style.visibility = "visible";
        const rot = ((cx - center) / center) * -14; // degrees, tilts toward the center
        c.style.transform = `translateY(${y}) scale(${s}) rotateY(${rot}deg)`;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
