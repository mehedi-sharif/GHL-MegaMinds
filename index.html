<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHL MegaMinds — Coming Soon</title>
  <meta name="description" content="GHL MegaMinds is launching soon. GoHighLevel automation, funnels and CRM systems for growth-minded businesses." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Archivo:wdth,wght@100,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f2f2;
      --ink: #000;
      --muted: #999;
      --colon: #333;
      --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-display: "Archivo", "Inter", system-ui, sans-serif;
      --speed: 42; /* marquee px per second */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .site {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ---------- Header ---------- */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 0;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      color: var(--ink);
    }
    .logo svg { width: 22px; height: 22px; display: block; }

    /* ---------- Ladybug hanging from the logo (draggable pendulum) ---------- */
    .pendulum {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: visible;
    }
    .pendulum svg.thread {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .pendulum .thread line {
      stroke: #111;
      stroke-width: 1.2;
      stroke-linecap: round;
    }
    .pendulum .web { fill: none; stroke: #111; stroke-width: 1; stroke-linecap: round; }
    .pendulum .web-splat { fill: none; stroke: #111; stroke-width: 0.9; stroke-linejoin: round; }
    .bob {
      position: absolute;
      left: 0; top: 0;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      transform-origin: 50% 50%;
      display: grid;
      place-items: center;
      color: var(--ink);
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }
    .bob.dragging { cursor: grabbing; }
    .bob svg {
      width: 40px; height: 40px; display: block;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bob.dragging svg { transform: scale(1.7); }
    .bob .hint {
      position: absolute;
      left: calc(100% + 6px);
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      transition: opacity 0.6s ease;
    }
    .bob.used .hint { opacity: 0; }

    /* ---------- Center content ---------- */
    .center {
      position: absolute;
      inset: 0;
      /* no z-index / transform here: a stacking context would isolate the
         difference blend from the marquee behind it */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding-bottom: 40px;
    }

    .countdown {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 4px;
      animation: fadeIn 1s 0.2s ease both;
    }

    .unit { display: flex; flex-direction: column; align-items: center; }
    .unit .n {
      font-size: 40px;
      font-weight: 400;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      min-width: 2ch;
      text-align: center;
    }
    .unit .l {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.2;
      margin-top: 4px;
    }
    .colon {
      font-size: 40px;
      line-height: 1.2;
      color: var(--colon);
      padding-top: 10px;
    }

    /* Headline: white + difference blend = black on light bg, inverts over images */
    .headline-wrap {
      position: relative;
      z-index: 2;
      mix-blend-mode: difference;
      color: #fff;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-family: var(--font-display);
      font-variation-settings: "wdth" 100;
      font-weight: 700;
      font-size: clamp(50px, 8.7vw, 125px);
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 .w {
      display: inline-block;
      animation: reveal 1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    h1 .w + .w { animation-delay: 0.15s; }

    h1 .sm {
      display: inline-block;
      font-size: 0.48em;
      vertical-align: top;
      line-height: 1.55;
      letter-spacing: 0;
    }

    /* ---------- Marquee ---------- */
    .marquee {
      position: absolute;
      inset: 0;
      overflow: hidden;
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }

    .track {
      position: absolute;
      top: 50%;
      left: 0;
      height: 247px;
      margin-top: -124px;
      display: flex;
      will-change: transform;
      transform-style: preserve-3d;
    }

    .card {
      position: relative;
      flex: 0 0 200px;
      width: 200px;
      height: 247px;
      margin-right: 260px;
      border-radius: 8px;
      overflow: hidden;
      transform-style: preserve-3d;
      will-change: transform;
      background: #ddd;
    }

    .card svg, .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* per-card scale & vertical offset (echoes the original's varied layout) */
    .card[data-s="1"]  { --s: 1.40; --y: -150px; }
    .card[data-s="2"]  { --s: 0.90; --y:   40px; }
    .card[data-s="3"]  { --s: 1.33; --y:  -30px; }
    .card[data-s="4"]  { --s: 1.16; --y:  -90px; }
    .card[data-s="5"]  { --s: 0.83; --y:  135px; }
    .card[data-s="6"]  { --s: 1.27; --y:  195px; }
    .card[data-s="7"]  { --s: 0.90; --y:   60px; }

    /* ---------- Footer ---------- */
    footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px 20px;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* ---------- Animations ---------- */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes reveal {
      from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 809px) {
      header { padding: 20px 20px 0; }

      .center {
        inset: 0 0 56vh 0;
        justify-content: flex-end;
        padding-bottom: 0;
      }
      .countdown { gap: 14px; }
      .unit .n { font-size: 40px; }
      h1 { font-size: clamp(40px, 13.5vw, 64px); }

      .marquee { top: 46vh; bottom: 96px; }
      .track { top: 50%; }
      .card { margin-right: 120px; }

      footer { font-size: 12px; }
      .card { --ymul: 0.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      h1 .w, .countdown { animation: none; }
    }
  </style>
</head>
<body>
  <div class="site">

    <header>
      <a class="logo" id="logo" href="/" aria-label="GHL MegaMinds home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <g stroke="currentColor" stroke-width="3" stroke-linecap="round">

    <!-- Hanging logo -->

          <g fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          <ellipse cx="24" cy="31" rx="9.5" ry="11" fill="#111"/>

          <!-- eyes -->
          <circle cx="21.6" cy="16.5" r="1.5" fill="#fff"/>

          <path d="M24 24v13" stroke="#e63b2e" stroke-width="2" stroke-linecap="round"/>

    <!-- Scrolling artwork -->
    <div class="marquee" aria-hidden="true">
      <div class="track" id="track">
        <!-- 1: sun over dunes -->
        <div class="card" data-s="1">
          <svg viewBox="0 0 170 210"><rect width="170" height="210" fill="#e9e2d5"/><circle cx="92" cy="72" r="46" fill="#f0703a"/><circle cx="106" cy="60" r="18" fill="#f6a24f" opacity=".85"/><g fill="none" stroke="#1f2a44" stroke-width="3"><path d="M-10 140c30-25 60-25 90 0s60 25 90 0"/><path d="M-10 156c30-25 60-25 90 0s60 25 90 0"/><path d="M-10 172c30-25 60-25 90 0s60 25 90 0"/><path d="M-10 188c30-25 60-25 90 0s60 25 90 0"/><path d="M-10 204c30-25 60-25 90 0s60 25 90 0"/></g><path d="M0 130c40 10 80 10 170 0v80H0z" fill="#e9e2d5" opacity=".0"/></svg>
        </div>
        <!-- 2: window on ochre wall -->
        <div class="card" data-s="2">
          <svg viewBox="0 0 170 210"><rect width="170" height="210" fill="#e08c3d"/><rect width="170" height="210" fill="url(#g2)"/><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3a453"/><stop offset="1" stop-color="#c8722a"/></linearGradient></defs><rect x="58" y="62" width="54" height="72" fill="#2a1d14"/><rect x="52" y="56" width="66" height="6" fill="#f4c383"/><rect x="52" y="134" width="66" height="7" fill="#b25f22"/><rect x="60" y="141" width="58" height="10" fill="#8f4a1a" opacity=".6"/></svg>
        </div>
        <!-- 3: bird over red -->
        <div class="card" data-s="3">
          <svg viewBox="0 0 170 210"><rect width="170" height="210" fill="#c43f1e"/><path d="M40 92c14-8 24-8 36-2 8-16 22-30 42-34-8 10-12 22-14 34 12 2 22 6 30 12-14-2-28 0-40 4-6 8-14 12-24 12-8 0-16-4-22-10-6 0-8-8-8-16z" fill="#f6efe4"/><path d="M28 98h12M118 108h20" stroke="#f6efe4" stroke-width="2" stroke-linecap="round"/><g fill="#f6efe4" opacity=".55"><path d="M42 146c14 6 24 6 36 2 8 14 22 26 42 30-8-8-12-20-14-30 12-2 22-6 30-12-14 2-28 0-40-4-6-8-14-12-24-12-8 0-16 4-22 10-6 0-8 8-8 16z"/></g><g stroke="#c43f1e" stroke-width="3"><path d="M20 150h130M20 162h130M20 174h130M20 186h130"/></g></svg>
        </div>
        <!-- 4: terracotta arches -->
        <div class="card" data-s="4">
          <svg viewBox="0 0 170 210"><rect width="170" height="210" fill="#b8391c"/><path d="M0 0h170v210H0z" fill="url(#g4)"/><defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9502a"/><stop offset="1" stop-color="#9f2f14"/></linearGradient></defs><path d="M30 210V90a55 55 0 0 1 110 0v120z" fill="#e4623a"/><path d="M52 210V100a33 33 0 0 1 66 0v110z" fill="#5f8f8f"/><g fill="#2a1a12" opacity=".35"><rect x="52" y="150" width="66" height="8"/><rect x="52" y="166" width="66" height="8"/><rect x="52" y="182" width="66" height="8"/><rect x="52" y="198" width="66" height="8"/></g></svg>

        <div class="card" data-s="6">

    <!-- Countdown + headline -->
    <div class="center">
      <div class="countdown" aria-label="Launch countdown">
        <div class="unit"><span class="n" id="days">00</span><span class="l">Days</span></div>
        <span class="colon">:</span>
        <div class="unit"><span class="n" id="hours">00</span><span class="l">Hours</span></div>
        <span class="colon">:</span>
        <div class="unit"><span class="n" id="minutes">00</span><span class="l">Minutes</span></div>
        <span class="colon">:</span>
        <div class="unit"><span class="n" id="seconds">00</span><span class="l">Seconds</span></div>
      </div>
      <div class="headline-wrap">
        <h1 aria-label="Coming soon">
          <span class="w" aria-hidden="true">Com<span class="sm">i</span><span class="sm">n</span>g</span>
          <span class="w" aria-hidden="true">S<span class="sm">o</span><span class="sm">o</span>n</span>
        </h1>
      </div>
    </div>

    <footer>
      <div class="copy">© <span id="year"></span> GHL MegaMinds. All rights reserved.</div>
    </footer>
  </div>

  <script>
    // ---- Launch date: change this ----
    const LAUNCH_DATE = new Date("2026-09-24T23:59:59");

    const pad = (n, w = 2) => String(Math.max(0, n)).padStart(w, "0");
    const $ = id => document.getElementById(id);
    function tick() {
      const diff = Math.max(0, LAUNCH_DATE - Date.now());
      $("days").textContent    = pad(Math.floor(diff / 864e5));
      $("hours").textContent   = pad(Math.floor(diff / 36e5) % 24);
      $("minutes").textContent = pad(Math.floor(diff / 6e4) % 60);
      $("seconds").textContent = pad(Math.floor(diff / 1e3) % 60);
    }
    tick(); setInterval(tick, 1000);
    $("year").textContent = new Date().getFullYear();

    // ---- Infinite 3D marquee ----
    const track = $("track");
    const originals = Array.from(track.children);
    // clone until we have enough to cover any viewport twice
    const needed = Math.ceil((window.innerWidth * 2) / (originals.length * 460)) + 1;
    for (let i = 0; i < needed; i++) originals.forEach(c => track.appendChild(c.cloneNode(true)));
    const cards = Array.from(track.children);

    const speed = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--speed")) || 60;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let setWidth = 0, offset = 0, last = performance.now();

    function measure() {
      const first = originals[0], lastOrig = originals[originals.length - 1];
      setWidth = (lastOrig.offsetLeft + lastOrig.offsetWidth + parseFloat(getComputedStyle(lastOrig).marginRight)) - first.offsetLeft;
    }
    measure();
    addEventListener("resize", measure);

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!reduce) offset = (offset + speed * dt) % setWidth;
      track.style.transform = `translate3d(${-offset}px,0,0)`;

      const vw = innerWidth, center = vw / 2;
      for (const c of cards) {
        const s = parseFloat(getComputedStyle(c).getPropertyValue("--s")) || 1;
        const cs = getComputedStyle(c);
        const y = (parseFloat(cs.getPropertyValue("--y")) || 0) * (parseFloat(cs.getPropertyValue("--ymul")) || 1) + "px";
        const cx = c.offsetLeft - offset + c.offsetWidth / 2;
        if (cx < -400 || cx > vw + 400) { c.style.visibility = "hidden"; continue; }
        c.style.visibility = "visible";
        const rot = ((cx - center) / center) * -14; // degrees, tilts toward the center
        c.style.transform = `translateY(${y}) scale(${s}) rotateY(${rot}deg)`;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ---- Spider on a silk thread: lowers itself from the logo, drag & fling to shoot webs ----
    (function () {
      const bob = document.getElementById("bob");
      const thread = document.getElementById("thread");
      const webs = document.getElementById("webs");
      const logo = document.getElementById("logo");
      const SVG_NS = "http://www.w3.org/2000/svg";
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let pivotX = 0, pivotY = 0, restLen = 0;
      const rest = () => {
        const r = logo.getBoundingClientRect();
        pivotX = r.left + r.width / 2;
        pivotY = r.bottom - 2;
        restLen = innerWidth < 810 ? 84 : 120;
      };
      rest(); addEventListener("resize", rest);

      // state (y is measured down from the pivot)
      let x = pivotX, y = 0, vx = 0, vy = 0;
      let curLen = 0;                 // current silk length; reels back to restLen after a long drag
      let dragging = false;
      const trail = [];               // recent pointer samples for release velocity
      const G = 2400, DAMP = 0.995, AIR = 0.999;
      let last = performance.now(), t = 0;

      // intro: crawl out of the logo and lower down the silk
      const INTRO_DELAY = 0.6, INTRO_DUR = reduce ? 0 : 2.2;
      let intro = true;
      bob.style.opacity = "0";

      const easeOut = k => 1 - Math.pow(1 - k, 3);

      function render() {
        const ang = Math.atan2(x - pivotX, y) * -180 / Math.PI;
        bob.style.transform = `translate(${x}px, ${pivotY + y}px) rotate(${ang}deg)`;
        thread.setAttribute("x1", pivotX); thread.setAttribute("y1", pivotY);
        thread.setAttribute("x2", x - 6 * Math.sin(ang * Math.PI / 180));
        thread.setAttribute("y2", pivotY + y - 12 * Math.cos(ang * Math.PI / 180));
        // any active web strands follow the spider
        for (const w of webs.querySelectorAll("line[data-live]")) {
          w.setAttribute("x1", x); w.setAttribute("y1", pivotY + y);
        }
      }

      function step(now) {
        const dt = Math.min(0.032, (now - last) / 1000); last = now; t += dt;

        if (intro) {
          const k = Math.max(0, Math.min(1, (t - INTRO_DELAY) / INTRO_DUR));
          const e = easeOut(k);
          y = restLen * e;
          x = pivotX + Math.sin(t * 6) * 2 * (1 - e);        // tiny wobble while descending
          bob.style.opacity = String(Math.min(1, k * 4));
          if (k >= 1) { intro = false; curLen = restLen; vx = 40; }
        } else if (!dragging) {
          // spider climbs back up its silk after being pulled far away
          curLen = Math.max(restLen, curLen + (restLen - curLen) * (1 - Math.exp(-dt * 2.2)));
          const ax = reduce ? 0 : Math.sin(t * 0.9) * 14 + Math.sin(t * 2.3) * 5;
          vx = (vx + ax * dt) * AIR; vy = (vy + G * dt) * AIR;
          x += vx * dt; y += vy * dt;
          const dx = x - pivotX, dy = y;
          const len = Math.hypot(dx, dy) || 1;
          if (len > curLen) {                                    // silk taut: constrain
            const nx = dx / len, ny = dy / len;
            x = pivotX + nx * curLen; y = ny * curLen;
            const vr = vx * nx + vy * ny;
            if (vr > 0) { vx -= vr * nx; vy -= vr * ny; }
            vx *= DAMP; vy *= DAMP;
          }
        }
        render();
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);

      // ---- web shooting ----
      function shootWeb(dirX, dirY, power) {
        const sx = x, sy = pivotY + y;
        const len = Math.max(140, Math.min(360, power / 4));
        let ex = sx + dirX * len, ey = sy + dirY * len;
        ex = Math.max(24, Math.min(innerWidth - 24, ex));
        ey = Math.max(24, Math.min(innerHeight - 24, ey));

        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("class", "web");
        line.setAttribute("x1", sx); line.setAttribute("y1", sy);
        line.setAttribute("x2", sx); line.setAttribute("y2", sy);
        line.dataset.live = "1";
        webs.appendChild(line);

        // splat: spokes + rings, drawn at the impact point
        const g = document.createElementNS(SVG_NS, "g");
        g.setAttribute("class", "web-splat");
        g.setAttribute("transform", `translate(${ex} ${ey}) rotate(${Math.random() * 360})`);
        g.style.opacity = "0";
        const R = 24;
        let d = "";
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4;
          d += `M0 0L${(R * Math.cos(a)).toFixed(1)} ${(R * Math.sin(a)).toFixed(1)}`;
        }
        for (const r of [7, 13, 20]) {
          const pts = [];
          for (let i = 0; i < 8; i++) {
            const a = i * Math.PI / 4 + Math.PI / 8;
            pts.push(`${(r * Math.cos(a)).toFixed(1)} ${(r * Math.sin(a)).toFixed(1)}`);
          }
          d += `M${pts.join("L")}Z`;
        }
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", d);
        g.appendChild(path);
        webs.appendChild(g);
        const splats = webs.querySelectorAll("g.web-splat");
        if (splats.length > 60) splats[0].remove();

        const t0 = performance.now();
        const SHOOT = 160, HOLD = 1100, FADE = 500;
        function anim(now) {
          const e = now - t0;
          if (e < SHOOT) {
            const k = easeOut(e / SHOOT);
            const cx = x, cy = pivotY + y;
            line.setAttribute("x2", cx + (ex - cx) * k); line.setAttribute("y2", cy + (ey - cy) * k);
          } else {
            line.setAttribute("x2", ex); line.setAttribute("y2", ey);
            g.style.opacity = String(Math.min(1, (e - SHOOT) / 120));
          }
          if (e > SHOOT + HOLD) {
            line.style.opacity = String(Math.max(0, 1 - (e - SHOOT - HOLD) / FADE));
            delete line.dataset.live;
          }
          if (e > SHOOT + HOLD + FADE) { line.remove(); return; }   // the web splat stays on the page
          requestAnimationFrame(anim);
        }
        requestAnimationFrame(anim);
      }

      // ---- drag ----
      bob.addEventListener("pointerdown", e => {
        if (intro) return;
        dragging = true; bob.classList.add("dragging", "used");
        bob.setPointerCapture(e.pointerId);
        trail.length = 0; trail.push({ t: performance.now(), x: e.clientX, y: e.clientY });
        e.preventDefault();
      });
      bob.addEventListener("pointermove", e => {
        if (!dragging) return;
        const now = performance.now();
        trail.push({ t: now, x: e.clientX, y: e.clientY });
        while (trail.length > 2 && now - trail[0].t > 120) trail.shift();
        // go anywhere on the page; silk just stretches
        x = Math.max(8, Math.min(innerWidth - 8, e.clientX));
        y = Math.max(8, Math.min(innerHeight - 8, e.clientY)) - pivotY;
      });
      const release = () => {
        if (!dragging) return;
        dragging = false; bob.classList.remove("dragging");

        // release velocity from the last ~120ms of movement
        let pvx = 0, pvy = 0;
        if (trail.length > 1) {
          const a = trail[0], b = trail[trail.length - 1];
          const dt = Math.max(0.016, (b.t - a.t) / 1000);
          pvx = (b.x - a.x) / dt; pvy = (b.y - a.y) / dt;
        }
        vx = Math.max(-1600, Math.min(1600, pvx)); vy = Math.max(-1600, Math.min(1600, pvy));

        // silk is as long as it was stretched; it reels back in from there
        curLen = Math.max(restLen, Math.hypot(x - pivotX, y));

        // always fire a web: along the throw, or outward from the logo if just let go
        const speed = Math.hypot(pvx, pvy);
        let dx, dy;
        if (speed > 150) { dx = pvx / speed; dy = pvy / speed; }
        else { const l = Math.hypot(x - pivotX, y) || 1; dx = (x - pivotX) / l; dy = y / l; }
        shootWeb(dx, dy, Math.max(speed, 1000));
      };
      bob.addEventListener("pointerup", release);
      bob.addEventListener("pointercancel", release);
      bob.addEventListener("lostpointercapture", release);
    })();
  </script>
</body>
</html>
